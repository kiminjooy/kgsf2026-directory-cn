<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 KGSF Directory</title>
  <style>
    :root{
      --black:#111827;
      --orange:#22582C;
      --bg:#f7f9fc;
      --line:#e5e7eb;
      --muted:#6b7280;
      --white:#fff;
      --shadow:0 18px 50px rgba(17,24,39,.12);
      --radius:20px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--black);
      
font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "SimHei", sans-serif;
    }
    button,input,textarea{font:inherit}
    .wrap{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:48px 0 120px}
    h1{margin:0 0 10px;font-size:42px;letter-spacing:-.04em}
    .sub{margin:0 0 32px;color:var(--muted);line-height:1.7}

    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .card{
      background:#fff;border:1px solid var(--line);border-radius:var(--radius);
      padding:22px;box-shadow:0 8px 24px rgba(17,24,39,.05);
      display:flex;flex-direction:column;min-height:210px;
    }
    .category{
      font-size:12px;
      font-weight:800;
      text-transform:uppercase;
    }

    .category.beauty{
      color:#e85d8e;
    }

    .category.food{
      color:#78a83b;
    }

    .category.home-living{
      color:#d6cb00;
    }

    .category.healthcare{
      color:#3b82c4;
    }

    .category.digital-industrial{
      color:#8b5cf6;
    }

    .category-separator{
     color:#9ca3af;
     font-size:12px;
     font-weight:800;
   }
    .card h3{margin:8px 0 8px;font-size:20px}
    .product-preview{color:var(--muted);font-size:13px;line-height:1.6;flex:1}
    .request-btn{
      margin-top:18px;height:44px;border:0;border-radius:12px;background:var(--black);
      color:#fff;font-weight:800;cursor:pointer;
    }
    .request-btn.added{background:#eaf2ff;color:#183153;border:1px solid #cddfff}

    .card-subcategories{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
     margin:2px 0 12px;
    }

    .card-subcategory{
      display:inline-block;
      padding:5px 8px;
      border-radius:999px;
      background:#f3f4f6;
      color:#4b5563;
      font-size:11px;
      font-weight:700;
      line-height:1.2;
    }
    .overlay{
      position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:50;
      display:none;align-items:center;justify-content:center;padding:20px;
    }
    .overlay.open{display:flex}
    .modal{
      width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;
      border-radius:26px;box-shadow:0 30px 100px rgba(0,0,0,.25);
    }
    .modal-head{
      position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);
      display:flex;justify-content:space-between;align-items:center;padding:20px 24px;z-index:2;
    }
    .modal-head h2{font-size:21px;margin:0}
    .close{border:0;background:#f1f3f5;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:20px}
    .modal-body{padding:24px}
    .field-label{display:block;font-weight:800;margin:0 0 10px}
    .help{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.6}
    .check-list{display:grid;gap:10px;margin-bottom:24px}
    .check-item,.radio-item{
      display:flex;gap:10px;align-items:center;border:1px solid var(--line);
      border-radius:12px;padding:12px 14px;cursor:pointer;
    }
    .check-item input, .radio-item input{margin:0;flex-shrink:0;accent-color:#111827}
    textarea,.text-input{
      width:100%;border:1px solid #d7dce3;border-radius:12px;padding:13px 14px;outline:none;
    }
    textarea{min-height:110px;resize:vertical}
    textarea:focus,.text-input:focus{border-color:#111827}
    .radio-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
    .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:26px}
    .btn{height:44px;padding:0 18px;border-radius:12px;border:0;font-weight:800;cursor:pointer}
    .btn.secondary{background:#eef1f5;color:#111827}
    .btn.primary{background:#111827;color:#fff}

    .submit-box{
      margin-top:22px;padding-top:22px;border-top:1px solid var(--line)
    }
    .submission-note{display:flex;align-items:flex-start;gap:9px;margin:16px 0 0;padding:12px 14px;background:#f7f9f5;border:1px solid #e2e9df;border-radius:10px;color:#4b5563;font-size:13px;line-height:1.6}
    .submission-note-icon{flex-shrink:0;color:#22582C;font-size:17px;line-height:1.25}
    .submission-note strong{color:#374151}
    .submit-btn{
      width:100%;height:52px;border:0;border-radius:14px;background:var(--orange);
      color:#fff;font-weight:900;cursor:pointer;margin-top:14px;
    }
    .submit-btn:disabled{opacity:.45;cursor:not-allowed}

    .success{
      text-align:center;padding:50px 28px;
    }
    .success .icon{font-size:48px;margin-bottom:12px}
    .success h2{margin:0 0 10px}
    .success p{color:var(--muted);line-height:1.7}

    .dev-note{
      margin:0 0 28px;padding:15px 17px;border-radius:14px;background:#ECF8EE;
      border:1px solid #90D49D;color:#22582C;font-size:13px;line-height:1.65;
    }

    .search-panel{
      margin:0 0 28px;
      padding:18px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:0 8px 24px rgba(17,24,39,.04);
    }

    .search-main{
      position:relative;
      margin-bottom:14px;
    }

    .search-icon{
      position:absolute;
      left:16px;
      top:50%;
      transform:translateY(-50%);
      color:#9ca3af;
      font-size:19px;
      pointer-events:none;
    }

    .search-input,
    .filter-select{
      width:100%;
      height:48px;
      border:1px solid #d7dce3;
      border-radius:12px;
      background:#fff;
      outline:none;
    }

    .search-input{
      padding:0 14px 0 46px;
    }

    .filter-select{
      padding:0 14px;
    }

    .search-input:focus,
    .filter-select:focus{
      border-color:#111827;
    }

    .filter-row{
      display:grid;
      grid-template-columns:1fr 1fr auto;
      gap:12px;
    }

    .reset-filter-btn{
      height:48px;
      padding:0 18px;
      border:1px solid #d7dce3;
      border-radius:12px;
      background:#fff;
      color:#374151;
      font-weight:700;
      cursor:pointer;
      white-space:nowrap;
    }

    .reset-filter-btn:hover{
      background:#f3f4f6;
    }

    .active-filters{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:14px;
    }

    .filter-chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      border:0;
      background:#f3f4f6;
      color:#374151;
      border-radius:999px;
      padding:7px 11px;
      font-size:12px;
      font-weight:700;
      cursor:pointer;
    }

    .filter-chip:hover{
      background:#e5e7eb;
    }

    .result-count{
      margin-top:14px;
      color:var(--muted);
      font-size:13px;
    }

    .card-top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
    }

    .meeting-badge{
      flex-shrink:0;
      background:#eaf2ff;
      color:#183153;
      border:1px solid #cddfff;
      border-radius:999px;
      padding:5px 9px;
      font-size:11px;
      font-weight:800;
      white-space:nowrap;
    }

    .detail-top-btn{
      position:fixed;
      right:28px;
      bottom:92px;
      z-index:19;
      width:48px;
      height:48px;
      border:1px solid var(--line);
      border-radius:50%;
      background:#fff;
      color:var(--black);
      box-shadow:0 8px 24px rgba(17,24,39,.14);
      font-size:18px;
      font-weight:900;
      cursor:pointer;
      display:none;
      align-items:center;
      justify-content:center;
    }

    .detail-top-btn:hover{
      background:#f3f4f6;
    }

    .detail-top-btn.show{
      display:flex;
    }

    .card-product-image{
      width:100%;
      height:145px;
      object-fit:contain;
      background:#f8f9fa;
      border-radius:14px;
      margin-bottom:16px;
    }

    .detail-subpages{
      margin-top:16px;
      padding:14px 0 0;
     font-size:13px;
      line-height:1.7;
    }

    .detail-subpage-label{
      margin-bottom:5px;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }

    .detail-subpages a{
      display:block;
      color:#374151;
      text-decoration:underline;
      text-underline-offset:2px;
      overflow-wrap:anywhere;
    }

    /* ============================================================
   ACCESS CODE SCREEN
   ============================================================ */

    .access-screen{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:#f7f8fa;
    }

    .access-card{
      width:100%;
      max-width:460px;
      padding:42px 36px;
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:24px;
      box-shadow:0 18px 50px rgba(0,0,0,.07);
      text-align:center;
    }

    .access-eyebrow{
      margin-bottom:10px;
      color:#6b7280;
      font-size:13px;
      font-weight:800;
      letter-spacing:.04em;
      text-transform:uppercase;
    }

    .access-card h1{
      margin:0 0 14px;
      font-size:30px;
    }

    .access-card p{
      margin:0 auto 28px;
      max-width:370px;
      color:#6b7280;
      font-size:14px;
      line-height:1.7;
    }

    .access-form{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .access-form input{
      width:100%;
      height:52px;
      padding:0 16px;
      border:1px solid #d1d5db;
      border-radius:12px;
      outline:none;
      font-size:15px;
      text-align:center;
      font-weight:700;
      letter-spacing:.03em;
      text-transform:uppercase;
      box-sizing:border-box;
    }

    .access-form input:focus{
      border-color:#111827;
      box-shadow:0 0 0 3px rgba(17,24,39,.08);
    }

    .access-form button{
      height:52px;
      border:0;
      border-radius:12px;
      background:#111827;
      color:#fff;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
    }

    .access-form button:disabled{
      opacity:.55;
     cursor:not-allowed;
    }

    .access-message{
      min-height:20px;
      margin-top:16px;
      color:#dc2626;
      font-size:13px;
      line-height:1.5;
    }

    .access-message.loading{
      color:#6b7280;
    }

    @media(max-width:560px){
      .access-card{
        padding:34px 22px;
        border-radius:20px;
      }

      .access-card h1{
        font-size:26px;
      }
    }

    .pagination{
      display:flex;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      gap:8px;
      margin-top:36px;
    }

    .page-btn{
      min-width:40px;
      height:40px;
      padding:0 12px;
      border:1px solid #d7dce3;
      border-radius:10px;
      background:#fff;
      color:#374151;
      font-weight:700;
      cursor:pointer;
    }

    .page-btn:hover{
      background:#f3f4f6;
    }

    .page-btn.active{
      background:#111827;
      color:#fff;
      border-color:#111827;
    }

    .page-btn:disabled{
      opacity:.4;
      cursor:not-allowed;
    }

    .detail-request-btn:disabled{
      background:#e5e7eb;
      color:#6b7280;
      cursor:not-allowed;
    }

    
/* Meeting Report Matrix */
    .report-matrix-wrap {
      overflow-x: auto;
      margin: 20px 0 26px;
    }

    .report-matrix {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
      table-layout: fixed;
    }

    .report-matrix th,
    .report-matrix td {
      padding: 14px 8px;
      text-align: center;
      border-bottom: 1px solid #eef0f3;
    }

    .report-matrix th:first-child,
    .report-matrix td:first-child {
      width: 32%;
      text-align: left;
      font-weight: 500;
    }

    .report-matrix th {
      font-size: 13px;
      font-weight: 700;
      color: #374151;
    }

    .report-matrix td {
      font-size: 14px;
    }

    .report-matrix input[type="radio"] {
      width: 19px;
      height: 19px;
      margin: 0;
      accent-color: #111827;
      cursor: pointer;
    }

    .report-matrix label {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 32px;
      cursor: pointer;
    }

    .report-matrix tbody tr:hover {
      background: #f9fafb;
    }


    .detail-page{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}
    .detail-topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
    .back-btn{border:0;background:#f1f3f5;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
    .detail-title{margin:0 0 8px;font-size:34px;letter-spacing:-.03em}
    .detail-desc{color:var(--muted);line-height:1.7;white-space: pre-line}
    .detail-chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 24px}
    .detail-chip{background:#f3f4f6;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700}
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}
    .detail-info{border:1px solid var(--line);border-radius:14px;padding:14px}
    .detail-info small{display:block;color:var(--muted);margin-bottom:5px}
    .detail-products{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:14px;margin-top:18px}
    .detail-product{border:1px solid var(--line);border-radius:16px;padding:16px}
    .detail-product h4{margin:0 0 8px}
    .cert-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    .cert-badge{font-size:12px;background:#ECF8EE;border:1px solid #90D49D;color:#22582C;border-radius:999px;padding:5px 8px}
    .detail-request-btn{
      border:0;border-radius:14px;background:var(--orange);color:#fff;font-weight:900;
      min-height:50px;padding:0 20px;cursor:pointer;
    }
    .detail-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .detail-links a{display:inline-block;text-decoration:none;background:#111827;color:#fff;border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px}

    @media(max-width:560px){
      .grid{grid-template-columns:1fr}
      .filter-row,.detail-grid{grid-template-columns:1fr}
      .reset-filter-btn{width:100%;}
      h1{font-size:34px}
      .radio-row{grid-template-columns:1fr}
      .detail-top-btn{right:16px;bottom:82px;}
    }
    @media (max-width:700px) {
      .detail-products { grid-template-columns:1fr; }
    }

     .product-image-fallback{min-height:170px;background:#f3f4f6;border:1px dashed #d1d5db;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#6b7280;font-size:13px;margin-bottom:16px}
     .product-image-fallback a{color:#374151;text-decoration:underline}
     .inline-request-section{margin-top:36px;padding:26px;border:1px solid var(--line);border-radius:18px;background:#fafbfc;scroll-margin-top:24px}
     .inline-request-section h3{margin:0 0 10px;font-size:24px}
     .inline-request-fields{margin-top:24px}
     .inline-request-fields .check-list{grid-template-columns:repeat(2,minmax(0,1fr))}
     .inline-save-btn{  display:block;width:fit-content;margin:24px auto 0;background:var(--orange);min-height:48px;padding:0 28px;}
     .inline-request-submitted{padding:18px;border-radius:12px;background:#ecfdf3;color:#166534;font-weight:700}
     @media(max-width:700px){.inline-request-section{padding:18px}.inline-request-fields .check-list{grid-template-columns:1fr}.inline-save-btn{width:100%}}

    /* Meeting List save confirmation */
    .meeting-toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,16px);z-index:110;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 32px);padding:14px 20px;border-radius:14px;background:#22582C;color:#fff;box-shadow:0 12px 36px rgba(0,0,0,.2);font-size:14px;font-weight:750;opacity:0;visibility:hidden;transition:opacity .2s,transform .2s,visibility .2s;pointer-events:none;text-align:center}
    .meeting-toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
    @media(max-width:700px){.meeting-toast{bottom:88px;width:max-content}}
  </style>
</head>
<body>

  <!-- ACCESS CODE SCREEN -->
  <div id="accessScreen" class="access-screen">
    <div class="access-card">

      <div class="access-eyebrow">
        2026 KGSF
      </div>

      <h1>Supplier Directory</h1>

      <p>
        Please enter the access code provided by KITA
        to view the supplier directory and submit meeting requests.
      </p>

      <div class="access-form">
        <input
          id="accessCodeInput"
          type="text"
          placeholder="Enter your access code"
          autocomplete="off"
          spellcheck="false"
        >

        <button
          id="accessCodeButton"
          type="button"
          onclick="submitAccessCode()"
        >
          Continue
        </button>
      </div>

      <div
        id="accessMessage"
        class="access-message"
      ></div>

    </div>
  </div>

  <main class="wrap" id="mainApp" hidden>
    <section id="directoryView">
      <h1>2026 KGSF 韩国供应商名录</h1>
      <p class="sub">
        2026 Korea Grand Sourcing Fair
      </p>

      <div class="dev-note">
        <b>预约洽谈:</b> 请从以下韩国供应商中选择至少20家感兴趣的企业，提交商务洽谈申请。
      </div>

      <div class="search-panel">

        <div class="search-main">
          <span class="search-icon">🔍</span>

          <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="搜索企业、产品或认证信息..."
            autocomplete="off"
          >
        </div>

        <div class="filter-row">

          <select id="categoryFilter" class="filter-select">
            <option value="">All Categories</option>
          </select>

          <select id="subcategoryFilter" class="filter-select">
            <option value="">All Subcategories</option>
          </select>

          <button
            id="resetFiltersBtn"
            class="reset-filter-btn"
            type="button"
            onclick="resetFilters()"
          >
            ↻ Reset
          </button>
        </div>

        <div id="activeFilters" class="active-filters"></div>
        <div id="resultCount" class="result-count"></div>

      </div>

      <section id="companyGrid" class="grid"></section>
      <div id="pagination" class="pagination"></div>
    </section>

    <section id="detailView" class="detail-page" hidden></section>
  </main>

  <button
  id="detailTopBtn"
  class="detail-top-btn"
  type="button"
  onclick="scrollDetailToTop()"
  aria-label="Back to top"
  title="Back to top">
  ↑</button>
  </div>

function buildMicrosoftFormUrl(sellerName, products, reason, priority, scores) {
  const url = new URL(FORM_BASE);
  url.searchParams.set("id", FORM_ID);
  url.searchParams.set(FORM_FIELDS.buyer, currentBuyerCompany);
  url.searchParams.set(FORM_FIELDS.seller, sellerName);
  url.searchParams.set(FORM_FIELDS.products, products.join(", "));
  if (reason) url.searchParams.set(FORM_FIELDS.reason, reason);
  if (priority) url.searchParams.set(FORM_FIELDS.priority, JSON.stringify(priority === "Yes" ? "是" : "否"));
  const answers = {};
  scores.forEach((score, i) => {
    if (SCORE_OPTIONS[score]) answers[EVALUATION_ROW_IDS[i]] = SCORE_OPTIONS[score];
  });
  url.searchParams.set(FORM_FIELDS.evaluation, JSON.stringify(answers));
  // Microsoft Forms displays literal '+' if URLSearchParams serializes spaces as '+'.
  return url.toString().replace(/\+/g, "%20");
}

let companies = [];

function loadCompanies() {
  fetch("./companies.json", { cache: "no-cache" })
    .then(res => {
      if (!res.ok) {
        throw new Error(`HTTP error: ${res.status}`);
      }
      return res.json();
    })
    .then(data => {
      if (!Array.isArray(data)) {
        throw new Error("companies.json must contain a JSON array.");
      }

      companies = data;
      initializeFilters();
      renderCompanies();

      const match = location.hash.match(/^#company=(.+)$/);
      if (match) {
        const id = decodeURIComponent(match[1]);
        const company = companies.find(c => String(c.id) === id);
        if (company) openCompanyDetail(company.id);
      }
    })
    .catch(error => {
      console.error("DATA LOAD ERROR:", error);
      document.getElementById("companyGrid").innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:40px;color:#6b7280">
          Failed to load companies.json.
        </div>
      `;
    });
}

function splitMultiValue(value) {
  return String(value || "")
    .split(/\r?\n|,\s*/)
    .map(v => v.trim())
    .filter(Boolean);
}

// Product images are uploaded to ./images/ with the product number as filename.
// Example: images/12345.jpg or images/12345.png
const IMAGE_EXTENSIONS = ["", ".jpg", ".jpeg", ".png", ".webp", ".gif", ".avif", ".bmp"];

function getProductNumber(product) {
  return String(product?.id || "").trim();
}

function productImageMarkup(product, className = "", extraStyle = "") {
  const number = getProductNumber(product);
  if (!number) return "";

  const base = `./images/${encodeURIComponent(number)}`;

  return `<img
    class="${escapeAttr(className)}"
    src="${escapeAttr(base)}"
    data-image-base="${escapeAttr(base)}"
    data-image-ext="0"
    alt="${escapeAttr(product.name || "")}"
    loading="lazy"
    style="${escapeAttr(extraStyle)}"
    onerror="tryNextProductImage(this)"
  >`;
}

function tryNextProductImage(img) {
  const next = Number(img.dataset.imageExt || 0) + 1;

  if (next >= IMAGE_EXTENSIONS.length) {
    img.onerror = null;
    img.remove();
    return;
  }

  img.dataset.imageExt = String(next);
  img.src = img.dataset.imageBase + IMAGE_EXTENSIONS[next];
}

function initializeFilters() {
  const categoryFilter = document.getElementById("categoryFilter");
  const subcategoryFilter = document.getElementById("subcategoryFilter");

  const availableCategories = new Set(
    companies.flatMap(company =>
      company.categories?.main || []
    )
  );

  const categories = CATEGORY_ORDER.filter(category =>
    availableCategories.has(category)
  );

  categoryFilter.innerHTML =
    `<option value="">产品大类</option>` +
    categories
      .map(category =>
        `<option value="${escapeAttr(category)}">
          ${escapeHtml(category)}
        </option>`
      )
      .join("");

  updateSubcategoryOptions();

  document
    .getElementById("searchInput")
    .addEventListener("input", () => {
      currentPage = 1;
      renderCompanies();
    });

  categoryFilter.addEventListener("change", () => {

    subcategoryFilter.value = "";

    updateSubcategoryOptions();
    renderCompanies();
  });

  subcategoryFilter.addEventListener(
    "change",
    renderCompanies
  );
}

function updateSubcategoryOptions() {
  const category =
    document.getElementById("categoryFilter").value;

  const subcategoryFilter =
    document.getElementById("subcategoryFilter");

  let subcategories = [];

  if (category) {

    subcategories =
      SUBCATEGORY_MAP[category] || [];

  } else {

    subcategories =
      Object.values(SUBCATEGORY_MAP).flat();
  }

  const availableSubcategories = new Set(
    companies.flatMap(company =>
      company.categories?.sub || []
    )
  );

  subcategories = subcategories.filter(sub =>
    availableSubcategories.has(sub)
  );

  subcategoryFilter.innerHTML =
    `<option value="">
      ${category
        ? `All ${escapeHtml(category)}`
        : "细分类别"
      }
    </option>` +
    subcategories
      .map(sub =>
        `<option value="${escapeAttr(sub)}">
          ${escapeHtml(sub)}
        </option>`
      )
      .join("");
}

function getCompanySearchText(company) {
  const productText = (company.products || [])
    .map(product => [
      product.name || "",
      product.certification || ""
    ].join(" "))
    .join(" ");

  return [
    company.companyName || "",
    ...(company.categories?.main || []),
    ...(company.categories?.sub || []),
    productText
  ]
    .join(" ")
    .toLowerCase();
}

function getCategoryClass(category) {
  const map = {
    "美容": "beauty",
    "食品和饮料": "food",
    "家居生活": "home-living",
    "健康": "healthcare",
    "数码产品": "digital-industrial"
  };

  return map[category] || "";
}

function getFilteredCompanies() {

  const keyword =
    document
      .getElementById("searchInput")
      ?.value
      .trim()
      .toLowerCase() || "";

  const category =
    document
      .getElementById("categoryFilter")
      ?.value || "";

  const subcategory =
    document
      .getElementById("subcategoryFilter")
      ?.value || "";


  return companies.filter(company => {

    const keywordMatch =
      !keyword ||
      getCompanySearchText(company)
        .includes(keyword);

    const categoryMatch =
      !category ||
      (company.categories?.main || [])
        .includes(category);

    const subcategoryMatch =
      !subcategory ||
      (company.categories?.sub || [])
        .includes(subcategory);

    return (
      keywordMatch &&
      categoryMatch &&
      subcategoryMatch
    );
  });
}

               `)

           </div>
         `

       }

  }).join("");
  renderPagination(totalPages);

function renderPagination(totalPages) {

  const container =
    document.getElementById("pagination");

  if (totalPages <= 1) {
    container.innerHTML = "";
    return;
  }

  const PAGES_PER_GROUP = 12;

  const currentGroup =
    Math.floor((currentPage - 1) / PAGES_PER_GROUP);

  const startPage =
    currentGroup * PAGES_PER_GROUP + 1;

  const endPage =
    Math.min(
      startPage + PAGES_PER_GROUP - 1,
      totalPages
    );

  let html = "";

  html += `
    <button
      class="page-btn"
      type="button"
      onclick="goToPage(${startPage - 1})"
      ${startPage === 1 ? "disabled" : ""}
    >
      ‹
    </button>
  `;

  for (
    let page = startPage;
    page <= endPage;
    page++
  ) {

    html += `
      <button
        class="page-btn ${page === currentPage ? "active" : ""}"
        type="button"
        onclick="goToPage(${page})"
      >
        ${page}
      </button>
    `;
  }


  html += `
    <button
      class="page-btn"
      type="button"
      onclick="goToPage(${endPage + 1})"
      ${endPage === totalPages ? "disabled" : ""}
    >
      ›
    </button>
  `;


  container.innerHTML = html;
}

function goToPage(page) {

  const totalPages =
    Math.ceil(
      getFilteredCompanies().length /
      ITEMS_PER_PAGE
    );

  if (
    page < 1 ||
    page > totalPages
  ) {
    return;
  }

  currentPage = page;

  renderCompanies();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

function backToDirectory(pushHistory = true) {
  const detailView = document.getElementById("detailView");
  const directoryView = document.getElementById("directoryView");

  detailView.hidden = true;
  directoryView.hidden = false;
  document.getElementById("detailTopBtn").classList.remove("show");

  if (pushHistory && location.hash.startsWith("#company=")) {
    history.pushState(
      {},
      "",
      location.pathname + location.search
    );
  }

  requestAnimationFrame(() => {
    window.scrollTo({
      top: directoryScrollY,
      left: 0,
      behavior: "auto"
    });
  });
}

window.addEventListener("popstate", () => {
  const match = location.hash.match(/^#company=(.+)$/);

  if (match) {
    const id = decodeURIComponent(match[1]);
    const company = companies.find(c => String(c.id) === id);
    if (company) openCompanyDetail(company.id);
  } else {
    backToDirectory(false);
  }
});


/* Direct Microsoft Forms link — no cart or Google Apps Script. */
function scrollToMeetingRequest() {
  document.getElementById("meetingRequestSection")?.scrollIntoView({behavior:"smooth",block:"start"});
}
function openMicrosoftRequest() {
  const company = companies.find(c => c.id === editingCompanyId);
  if (!company) return;
  const products = [...document.querySelectorAll('input[name="meetingProduct"]:checked')].map(el => el.value);
  const reason = document.getElementById("reasonInput")?.value.trim() || "";
  const priority = document.querySelector('input[name="priority"]:checked')?.value || "";
  const scores = REPORT_QUESTIONS.map((_,i) => Number(document.querySelector(`input[name="report_${i}"]:checked`)?.value || 0));
  if (!products.length) { alert("Please select at least one interested product."); return; }
  if (!priority) { alert("Please select Yes or No for priority matching."); return; }
  if (scores.some(v => !v)) { alert("Please complete all five company evaluation criteria."); return; }
  const url = buildMicrosoftFormUrl(company.companyName, products, reason, priority, scores);
  window.open(url, "_blank", "noopener,noreferrer");
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttr(value) {
  return escapeHtml(value);
}

function scrollDetailToTop() {
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

/* ============================================================
   INIT
   ============================================================ */

if ("scrollRestoration" in history) {
  history.scrollRestoration = "manual";
}


loadCompanies();

const savedAccessCode = sessionStorage.getItem("BuyerAccessCode");
if (savedAccessCode && Object.prototype.hasOwnProperty.call(BUYER_CODES, savedAccessCode)) {
  currentBuyerCode = savedAccessCode;
  currentBuyerCompany = BUYER_CODES[savedAccessCode];
  openDirectory();
}
document.getElementById("accessCodeInput").addEventListener("keydown", event => {
  if (event.key === "Enter") submitAccessCode();
});
