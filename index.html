<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Request Directory - Draft</title>
  <style>
    :root{
      --black:#111827;
      --orange:#ff8500;
      --bg:#f7f9fc;
      --line:#e5e7eb;
      --muted:#6b7280;
      --white:#fff;
      --shadow:0 18px 50px rgba(17,24,39,.12);
      --radius:20px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--black);
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
    }
    button,input,textarea{font:inherit}
    .wrap{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:48px 0 120px}
    h1{margin:0 0 10px;font-size:42px;letter-spacing:-.04em}
    .sub{margin:0 0 32px;color:var(--muted);line-height:1.7}

    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .card{
      background:#fff;border:1px solid var(--line);border-radius:var(--radius);
      padding:22px;box-shadow:0 8px 24px rgba(17,24,39,.05);
      display:flex;flex-direction:column;min-height:210px;
    }
    .category{
      font-size:12px;
      font-weight:800;
      text-transform:uppercase;
    }

    .category.beauty{
      color:#e85d8e;
    }

    .category.food{
      color:#78a83b;
    }

    .category.home-living{
      color:#d6cb00;
    }

    .category.healthcare{
      color:#3b82c4;
    }

    .category.digital-industrial{
      color:#8b5cf6;
    }

    .category-separator{
     color:#9ca3af;
     font-size:12px;
     font-weight:800;
   }
    .card h3{margin:8px 0 8px;font-size:20px}
    .product-preview{color:var(--muted);font-size:13px;line-height:1.6;flex:1}
    .request-btn{
      margin-top:18px;height:44px;border:0;border-radius:12px;background:var(--black);
      color:#fff;font-weight:800;cursor:pointer;
    }
    .request-btn.added{background:#eaf2ff;color:#183153;border:1px solid #cddfff}

    .card-subcategories{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
     margin:2px 0 12px;
    }

    .card-subcategory{
      display:inline-block;
      padding:5px 8px;
      border-radius:999px;
      background:#f3f4f6;
      color:#4b5563;
      font-size:11px;
      font-weight:700;
      line-height:1.2;
    }

    .cart-fab{
      position:fixed;right:28px;bottom:28px;z-index:20;border:0;border-radius:999px;
      padding:15px 20px;background:var(--orange);color:#fff;font-weight:800;
      box-shadow:var(--shadow);cursor:pointer;

      display:none !important;
    }

    .overlay{
      position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:50;
      display:none;align-items:center;justify-content:center;padding:20px;
    }
    .overlay.open{display:flex}
    .modal{
      width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;
      border-radius:26px;box-shadow:0 30px 100px rgba(0,0,0,.25);
    }
    .modal-head{
      position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);
      display:flex;justify-content:space-between;align-items:center;padding:20px 24px;z-index:2;
    }
    .modal-head h2{font-size:21px;margin:0}
    .close{border:0;background:#f1f3f5;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:20px}
    .modal-body{padding:24px}
    .field-label{display:block;font-weight:800;margin:0 0 10px}
    .help{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.6}
    .check-list{display:grid;gap:10px;margin-bottom:24px}
    .check-item,.radio-item{
      display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);
      border-radius:12px;padding:12px 14px;cursor:pointer;
    }
    textarea,.text-input{
      width:100%;border:1px solid #d7dce3;border-radius:12px;padding:13px 14px;outline:none;
    }
    textarea{min-height:110px;resize:vertical}
    textarea:focus,.text-input:focus{border-color:#111827}
    .radio-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
    .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:26px}
    .btn{height:44px;padding:0 18px;border-radius:12px;border:0;font-weight:800;cursor:pointer}
    .btn.secondary{background:#eef1f5;color:#111827}
    .btn.primary{background:#111827;color:#fff}

    .cart-item{
      border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;
    }
    .cart-item h4{margin:0 0 8px}
    .cart-meta{font-size:13px;color:var(--muted);line-height:1.6}
    .cart-actions{display:flex;gap:8px;margin-top:12px}
    .mini-btn{border:0;background:#f1f3f5;border-radius:10px;padding:8px 10px;font-weight:700;cursor:pointer}
    .mini-btn.remove{color:#b42318;background:#fff0ee}

    .submit-box{
      margin-top:22px;padding-top:22px;border-top:1px solid var(--line)
    }
    .submit-btn{
      width:100%;height:52px;border:0;border-radius:14px;background:var(--orange);
      color:#fff;font-weight:900;cursor:pointer;margin-top:14px;
    }
    .submit-btn:disabled{opacity:.45;cursor:not-allowed}

    .success{
      text-align:center;padding:50px 28px;
    }
    .success .icon{font-size:48px;margin-bottom:12px}
    .success h2{margin:0 0 10px}
    .success p{color:var(--muted);line-height:1.7}

    .dev-note{
      margin:0 0 28px;padding:15px 17px;border-radius:14px;background:#fff7ed;
      border:1px solid #fed7aa;color:#9a3412;font-size:13px;line-height:1.65;
    }

    .search-panel{
      margin:0 0 28px;
      padding:18px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:0 8px 24px rgba(17,24,39,.04);
    }

    .search-main{
      position:relative;
      margin-bottom:14px;
    }

    .search-icon{
      position:absolute;
      left:16px;
      top:50%;
      transform:translateY(-50%);
      color:#9ca3af;
      font-size:19px;
      pointer-events:none;
    }

    .search-input,
    .filter-select{
      width:100%;
      height:48px;
      border:1px solid #d7dce3;
      border-radius:12px;
      background:#fff;
      outline:none;
    }

    .search-input{
      padding:0 14px 0 46px;
    }

    .filter-select{
      padding:0 14px;
    }

    .search-input:focus,
    .filter-select:focus{
      border-color:#111827;
    }

    .filter-row{
      display:grid;
      grid-template-columns:1fr 1fr auto;
      gap:12px;
    }

    .reset-filter-btn{
      height:48px;
      padding:0 18px;
      border:1px solid #d7dce3;
      border-radius:12px;
      background:#fff;
      color:#374151;
      font-weight:700;
      cursor:pointer;
      white-space:nowrap;
    }

    .reset-filter-btn:hover{
      background:#f3f4f6;
    }

    .active-filters{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:14px;
    }

    .filter-chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      border:0;
      background:#f3f4f6;
      color:#374151;
      border-radius:999px;
      padding:7px 11px;
      font-size:12px;
      font-weight:700;
      cursor:pointer;
    }

    .filter-chip:hover{
      background:#e5e7eb;
    }

    .result-count{
      margin-top:14px;
      color:var(--muted);
      font-size:13px;
    }

    .card-top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
    }

    .meeting-badge{
      flex-shrink:0;
      background:#eaf2ff;
      color:#183153;
      border:1px solid #cddfff;
      border-radius:999px;
      padding:5px 9px;
      font-size:11px;
      font-weight:800;
      white-space:nowrap;
    }

    .detail-top-btn{
      position:fixed;
      right:28px;
      bottom:92px;
      z-index:19;
      width:48px;
      height:48px;
      border:1px solid var(--line);
      border-radius:50%;
      background:#fff;
      color:var(--black);
      box-shadow:0 8px 24px rgba(17,24,39,.14);
      font-size:18px;
      font-weight:900;
      cursor:pointer;
      display:none;
      align-items:center;
      justify-content:center;
    }

    .detail-top-btn:hover{
      background:#f3f4f6;
    }

    .detail-top-btn.show{
      display:flex;
    }

    .card-product-image{
      width:100%;
      height:145px;
      object-fit:contain;
      background:#f8f9fa;
      border-radius:14px;
      margin-bottom:16px;
    }

    .detail-subpages{
      margin-top:16px;
      padding:14px 0 0;
     font-size:13px;
      line-height:1.7;
    }

    .detail-subpage-label{
      margin-bottom:5px;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }

    .detail-subpages a{
      display:block;
      color:#374151;
      text-decoration:underline;
      text-underline-offset:2px;
      overflow-wrap:anywhere;
    }

    /* ============================================================
   ACCESS CODE SCREEN
   ============================================================ */

    .access-screen{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:#f7f8fa;
    }

    .access-card{
      width:100%;
      max-width:460px;
      padding:42px 36px;
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:24px;
      box-shadow:0 18px 50px rgba(0,0,0,.07);
      text-align:center;
    }

    .access-eyebrow{
      margin-bottom:10px;
      color:#6b7280;
      font-size:13px;
      font-weight:800;
      letter-spacing:.04em;
      text-transform:uppercase;
    }

    .access-card h1{
      margin:0 0 14px;
      font-size:30px;
    }

    .access-card p{
      margin:0 auto 28px;
      max-width:370px;
      color:#6b7280;
      font-size:14px;
      line-height:1.7;
    }

    .access-form{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .access-form input{
      width:100%;
      height:52px;
      padding:0 16px;
      border:1px solid #d1d5db;
      border-radius:12px;
      outline:none;
      font-size:15px;
      text-align:center;
      font-weight:700;
      letter-spacing:.03em;
      text-transform:uppercase;
      box-sizing:border-box;
    }

    .access-form input:focus{
      border-color:#111827;
      box-shadow:0 0 0 3px rgba(17,24,39,.08);
    }

    .access-form button{
      height:52px;
      border:0;
      border-radius:12px;
      background:#111827;
      color:#fff;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
    }

    .access-form button:disabled{
      opacity:.55;
     cursor:not-allowed;
    }

    .access-message{
      min-height:20px;
      margin-top:16px;
      color:#dc2626;
      font-size:13px;
      line-height:1.5;
    }

    .access-message.loading{
      color:#6b7280;
    }

    @media(max-width:560px){
      .access-card{
        padding:34px 22px;
        border-radius:20px;
      }

      .access-card h1{
        font-size:26px;
      }
    }

    .pagination{
      display:flex;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      gap:8px;
      margin-top:36px;
    }

    .page-btn{
      min-width:40px;
      height:40px;
      padding:0 12px;
      border:1px solid #d7dce3;
      border-radius:10px;
      background:#fff;
      color:#374151;
      font-weight:700;
      cursor:pointer;
    }

    .page-btn:hover{
      background:#f3f4f6;
    }

    .page-btn.active{
      background:#111827;
      color:#fff;
      border-color:#111827;
    }

    .page-btn:disabled{
      opacity:.4;
      cursor:not-allowed;
    }

    .detail-request-btn:disabled{
      background:#e5e7eb;
      color:#6b7280;
      cursor:not-allowed;
    }

    .detail-page{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}
    .detail-topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
    .back-btn{border:0;background:#f1f3f5;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
    .detail-title{margin:0 0 8px;font-size:34px;letter-spacing:-.03em}
    .detail-desc{color:var(--muted);line-height:1.7}
    .detail-chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 24px}
    .detail-chip{background:#f3f4f6;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700}
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}
    .detail-info{border:1px solid var(--line);border-radius:14px;padding:14px}
    .detail-info small{display:block;color:var(--muted);margin-bottom:5px}
    .detail-products{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:14px;margin-top:18px}
    .detail-product{border:1px solid var(--line);border-radius:16px;padding:16px}
    .detail-product h4{margin:0 0 8px}
    .cert-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    .cert-badge{font-size:12px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:999px;padding:5px 8px}
    .detail-request-btn{
      border:0;border-radius:14px;background:var(--orange);color:#fff;font-weight:900;
      min-height:50px;padding:0 20px;cursor:pointer;
    }
    .evaluation-section{scroll-margin-top:24px;margin-top:36px;padding-top:26px;border-top:1px solid var(--line)}
    .evaluation-section h3{margin:0 0 8px;font-size:22px}
    .evaluation-frame{display:block;width:100%;height:850px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-top:18px}
    .evaluation-fallback{font-size:13px;color:var(--muted);line-height:1.6;margin-top:12px}
    .evaluation-fallback a{color:#1d4ed8}
    @media(max-width:560px){.evaluation-frame{height:950px}}
    .detail-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .detail-links a{display:inline-block;text-decoration:none;background:#111827;color:#fff;border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px}

    @media(max-width:560px){
      .grid{grid-template-columns:1fr}
      .filter-row,.detail-grid{grid-template-columns:1fr}
      .reset-filter-btn{width:100%;}
      h1{font-size:34px}
      .cart-fab{right:16px;bottom:16px}
      .radio-row{grid-template-columns:1fr}
      .detail-top-btn{right:16px;bottom:82px;}
    }
    @media(max-width:700px){.detail-products{grid-template-columns:1fr;}}
  </style>
</head>

  <main class="wrap" id="mainApp">
    <section id="directoryView">
      <h1>Supplier Directory</h1>
      <p class="sub">
        Korea Grand Sourcing Fair 2026
      </p>

      <div class="search-panel">

        <div class="search-main">
          <span class="search-icon">🔍</span>

          <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="Search companies, products, certifications..."
            autocomplete="off"

        </div>

        <div class="filter-row">

          <select id="categoryFilter" class="filter-select">
            <option value="">All Categories</option>

          <select id="subcategoryFilter" class="filter-select">
            <option value="">All Subcategories</option>
          </select>

          <button
            id="resetFiltersBtn"
            class="reset-filter-btn"
            type="button"
            onclick="resetFilters()"
          >
            ↻ Reset
          </button>
        </div>

        <div id="activeFilters" class="active-filters"></div>
        <div id="resultCount" class="result-count"></div>

      </div>

      <section id="companyGrid" class="grid"></section>
      <div id="pagination" class="pagination"></div>
    </section>

    <section id="detailView" class="detail-page" hidden></section>
  </main>

  <button
  id="detailTopBtn"
  class="detail-top-btn"
  type="button"
  onclick="scrollDetailToTop()"
  aria-label="Back to top"
  title="Back to top">
  ↑</button>

  <button id="cartFab" class="cart-fab" type="button" onclick="openCart()" hidden>
    Meeting List (<span id="cartCount">0</span>)
  </button>

   실제 사용 시 companies.json의 company.companyName / products[].name과 연결
   ============================================================ */

let companies = [];

function loadCompanies() {
  fetch("./companies.json", { cache: "no-cache" })
    .then(res => {
      if (!res.ok) {
        throw new Error(`HTTP error: ${res.status}`);
      }
      return res.json();
    })
    .then(data => {
      if (!Array.isArray(data)) {
        throw new Error("companies.json must contain a JSON array.");
      }

      companies = data;
      initializeFilters();
      renderCompanies();
      updateCartCount();

      const match = location.hash.match(/^#company=(.+)$/);
      if (match) {
        const id = decodeURIComponent(match[1]);
        const company = companies.find(c => String(c.id) === id);
        if (company) openCompanyDetail(company.id);
      }
    })
    .catch(error => {
      console.error("DATA LOAD ERROR:", error);
      document.getElementById("companyGrid").innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:40px;color:#6b7280">
          Failed to load companies.json.
        </div>
      `;
    });
}

function splitMultiValue(value) {
  return String(value || "")
    .split(/\r?\n|,\s*/)
    .map(v => v.trim())
    .filter(Boolean);
}

function convertDriveImageUrl(url) {
  const value = String(url || "").trim();

  const match =
    value.match(/[?&]id=([^&]+)/) ||
    value.match(/\/d\/([^/]+)/);

  if (!match) return value;

  const fileId = match[1];

  return `https://drive.google.com/thumbnail?id=${fileId}&sz=w1200`;
}

function initializeFilters() {
  const categoryFilter = document.getElementById("categoryFilter");

  const availableCategories = new Set(
    companies.flatMap(company =>
      company.categories?.main || []
    )
  );

  const categories = CATEGORY_ORDER.filter(category =>
    availableCategories.has(category)
  );

  categoryFilter.innerHTML =
    `<option value="">All Categories</option>` +
    categories
      .map(category =>
        `<option value="${escapeAttr(category)}">
          ${escapeHtml(category)}
        </option>`
      )
      .join("");

  updateSubcategoryOptions();

  document
    .getElementById("searchInput")
    .addEventListener("input", () => {
      currentPage = 1;
      renderCompanies();
    });

  categoryFilter.addEventListener("change", () => {

    // 메인카테고리 바꾸면 기존 서브카테고리 선택 해제
    subcategoryFilter.value = "";

    updateSubcategoryOptions();
    renderCompanies();
  });

  subcategoryFilter.addEventListener(
    "change",

  );
}

function updateSubcategoryOptions() {
  const category =
    document.getElementById("categoryFilter").value;

  const subcategoryFilter =
    document.getElementById("subcategoryFilter");

  let subcategories = [];

  if (category) {

    // 선택한 대카테고리에 해당하는 서브카테고리만
    subcategories =
      SUBCATEGORY_MAP[category] || [];

  } else {

    // 대카테고리 미선택 시 전체 서브카테고리
    subcategories =
      Object.values(SUBCATEGORY_MAP).flat();
  }

  // 실제 companies.json에 존재하는 서브카테고리만 표시
  const availableSubcategories = new Set(
    companies.flatMap(company =>
      company.categories?.sub || []
    )
  );

  subcategories = subcategories.filter(sub =>
    availableSubcategories.has(sub)
  );

  subcategoryFilter.innerHTML =
    `<option value="">
      ${category
        ? `All ${escapeHtml(category)}`
        : "All Subcategories"
      }
    </option>` +
    subcategories
      .map(sub =>
        `<option value="${escapeAttr(sub)}">
          ${escapeHtml(sub)}
        </option>`
      )
      .join("");
}

function getCompanySearchText(company) {
  const productText = (company.products || [])
    .map(product => [
      product.name || "",
      product.certification || ""
    ].join(" "))
    .join(" ");

  return [
    company.companyName || "",
    ...(company.categories?.main || []),
    ...(company.categories?.sub || []),
    productText
  ]
    .join(" ")
    .toLowerCase();
}

function getCategoryClass(category) {
  const map = {
    "Beauty": "beauty",
    "Food": "food",
    "Home&Living": "home-living",
    "Healthcare": "healthcare",
    "Digital&Industrial": "digital-industrial"
  };

  return map[category] || "";
}

function getFilteredCompanies() {

  const keyword =
    document
      .getElementById("searchInput")
      ?.value
      .trim()
      .toLowerCase() || "";

  const category =
    document
      .getElementById("categoryFilter")
      ?.value || "";

  const subcategory =
    document
      .getElementById("subcategoryFilter")
      ?.value || "";


  return companies.filter(company => {

    const keywordMatch =
      !keyword ||
      getCompanySearchText(company)
        .includes(keyword);

    const categoryMatch =
      !category ||
      (company.categories?.main || [])
        .includes(category);

    const subcategoryMatch =
      !subcategory ||
      (company.categories?.sub || [])
        .includes(subcategory);

    return (
      keywordMatch &&
      categoryMatch &&
      subcategoryMatch
    );
  });
}

function renderPagination(totalPages) {

  const container =
    document.getElementById("pagination");

  if (totalPages <= 1) {
    container.innerHTML = "";
    return;
  }

  const PAGES_PER_GROUP = 12;

  const currentGroup =
    Math.floor((currentPage - 1) / PAGES_PER_GROUP);

  const startPage =
    currentGroup * PAGES_PER_GROUP + 1;

  const endPage =
    Math.min(
      startPage + PAGES_PER_GROUP - 1,
      totalPages
    );

  let html = "";


  // 이전 12페이지 그룹
  html += `
    <button
      class="page-btn"
      type="button"
      onclick="goToPage(${startPage - 1})"
      ${startPage === 1 ? "disabled" : ""}
    >
      ‹
    </button>
  `;


  // 현재 그룹 페이지 번호
  for (
    let page = startPage;
    page <= endPage;
    page++
  ) {

    html += `
      <button
        class="page-btn ${page === currentPage ? "active" : ""}"
        type="button"
        onclick="goToPage(${page})"
      >
        ${page}
      </button>
    `;
  }


  // 다음 12페이지 그룹
  html += `
    <button
      class="page-btn"
      type="button"
      onclick="goToPage(${endPage + 1})"
      ${endPage === totalPages ? "disabled" : ""}
    >
      ›
    </button>
  `;


  container.innerHTML = html;
}

function goToPage(page) {

  const totalPages =
    Math.ceil(
      getFilteredCompanies().length /
      ITEMS_PER_PAGE
    );

  if (
    page < 1 ||
    page > totalPages
  ) {
    return;
  }

  currentPage = page;

  renderCompanies();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

function openRequestModal(companyId) {
  const company = companies.find(c => c.id === companyId);
  if (!company) return;

  const alreadySubmitted =
    submittedRequests.some(
      item => item.companyId === companyId
    );

  if (alreadySubmitted) {
    alert("This meeting request has already been submitted.");
    return;
  }

  editingCompanyId = companyId;

  const existing = cart.find(item => item.companyId === companyId);

  document.getElementById("requestTitle").textContent =
    `Meeting Request · ${company.companyName}`;

  document.getElementById("productCheckboxes").innerHTML =
    (company.products || []).filter(product => product && product.name).map((product, index) => {
      const checked =
        existing?.products?.includes(product.name) ? "checked" : "";

      return `
        <label class="check-item">
          <input
            type="checkbox"
            name="meetingProduct"
            value="${escapeAttr(product.name)}"
            ${checked}
          >
          <span>${escapeHtml(product.name)}</span>
        </label>
      `;
    }).join("");

  document.getElementById("reasonInput").value =
    existing?.reason || "";

  document.querySelectorAll('input[name="priority"]').forEach(radio => {
    radio.checked = existing?.priority === radio.value;
  });

  document.getElementById("requestOverlay").classList.add("open");
}

function closeRequestModal() {
  document.getElementById("requestOverlay").classList.remove("open");
  editingCompanyId = null;
}

function saveToCart() {
  const company = companies.find(c => c.id === editingCompanyId);
  if (!company) return;

  if (
  submittedRequests.some(
    item => item.companyId === company.id
  )
) {
  alert(
    "This company has already been submitted."
  );
  return;
}

  const products = [
    ...document.querySelectorAll('input[name="meetingProduct"]:checked')
  ].map(input => input.value);

  const reason = document.getElementById("reasonInput").value.trim();

  const priority =
    document.querySelector('input[name="priority"]:checked')?.value || "";

  if (!products.length) {
    alert("관심 제품을 1개 이상 선택해 주세요.");
    return;
  }

  if (!reason) {
    alert("미팅 신청 이유를 입력해 주세요.");
    return;
  }

  if (!priority) {
    alert("우선 매칭 여부를 선택해 주세요.");
    return;
  }

  const alreadyExists = cart.some(item => item.companyId === company.id);

  const totalRequestCount =
    submittedRequests.length + cart.length;

  if (
    !alreadyExists &&
    totalRequestCount >= 30
  ) {
    alert(
      "Submitted requests and current meeting requests combined cannot exceed 30 companies."
    );
    return;
  }

  const newItem = {
    companyId: company.id,
    companyName: company.companyName,

    // 체크한 제품 텍스트 값이 그대로 배열로 저장됨
    products,

    // Google Form의 '제품명' 문항에는 이 값을 보냄
    productText: products.join(", "),

    // Google Form '셀렉 이유'
    reason,

    // Google Form '우선 순위'
    priority
  };

  const index = cart.findIndex(item => item.companyId === company.id);

  if (index >= 0) {
    cart[index] = newItem;
  } else {
    cart.push(newItem);
  }

  saveMeetingDraft();

  updateCartCount();
  renderCompanies();
  closeRequestModal();

  if (!document.getElementById("detailView").hidden) {
    openCompanyDetail(company.id, false);
  }
}

function updateCartCount() {
  document.getElementById("cartCount").textContent = cart.length;
}


/* ============================================================
   6) 장바구니
   ============================================================ */

function openCart() {
  renderCart();
  document.getElementById("cartOverlay").classList.add("open");
}

function closeCart() {
  document.getElementById("cartOverlay").classList.remove("open");
}

function renderCart() {
  const body = document.getElementById("cartBody");

  const isFirstSubmission =
    submittedRequests.length === 0;

  const totalCount =
    submittedRequests.length + cart.length;

  const submittedHtml = submittedRequests.length
  ? `
    <div style="margin-bottom:28px;">
      <h3 style="margin:0 0 14px;">
        Submitted Requests (${submittedRequests.length})
      </h3>

      ${submittedRequests.map(item => `
        <div class="cart-item">
          <h4>${escapeHtml(item.companyName || "")}</h4>

          <div class="cart-meta">
            <b>Products</b><br>
            ${escapeHtml(
              item.productText ||
              (Array.isArray(item.products)
                ? item.products.join(", ")
                : "")
            )}

            <br><br>

            <b>Reason</b><br>
            ${escapeHtml(item.reason || "")}

            <br><br>

            <b>Priority</b><br>
            ${escapeHtml(item.priority || "")}
          </div>

          <div
            style="
              display:inline-block;
              margin-top:12px;
              padding:6px 10px;
              border-radius:999px;
              background:#ecfdf3;
              color:#15803d;
              font-size:12px;
              font-weight:800;
            "
          >
            ✓ Meeting Requested
          </div>
        </div>
      `).join("")}
    </div>
  `
  : "";

  const currentHtml = cart.length
    ? `


        ${cart.map(item => `
          <div class="cart-item">
            <h4>${escapeHtml(item.companyName)}</h4>

            <div class="cart-meta">
              <b>Products</b><br>
              ${item.products.map(escapeHtml).join(", ")}

              <br><br>

              <b>Reason</b><br>
              ${escapeHtml(item.reason)}

              <br><br>

              <b>Priority</b><br>
              ${escapeHtml(item.priority)}
            </div>

            <div class="cart-actions">
              <button
                class="mini-btn"
                onclick='editCartItem(${JSON.stringify(item.companyId)})'
              >
                Edit
              </button>

              <button
                class="mini-btn remove"
                onclick='removeCartItem(${JSON.stringify(item.companyId)})'
              >
                Remove
              </button>
            </div>
          </div>
        `).join("")}
      </div>
    `
    : `
      <div style="text-align:center;padding:24px 10px;color:#6b7280">
        No new meeting requests added.
      </div>
    `;


  const noticeText =
    isFirstSubmission
      ? (
          cart.length < 15
            ? `Please select at least 15 companies. (${cart.length}/15)`
            : `Ready to submit · ${cart.length} companies selected`
        )
      : (
          `${submittedRequests.length} submitted · ` +
          `${cart.length} new · ` +
          `${totalCount}/30 total`
        );


  const submitDisabled =
    !cart.length ||
    (isFirstSubmission && cart.length < 15) ||
    totalCount > 30;


  body.innerHTML = `
    ${submittedHtml}

    ${currentHtml}

    <div class="submit-box">
      <label
        class="field-label"
        for="buyerCompanyInput"
      >
        Buyer Company
      </label>

      <p class="help">
        Your company name is linked to your access code.
      </p>

      <input
        id="buyerCompanyInput"
        class="text-input"
        type="text"
        value="${escapeAttr(currentBuyerCompany)}"
        readonly
      >

      <p
        id="minimumNotice"
        class="help"
        style="margin-top:14px;font-weight:700"
      >
        ${noticeText}
      </p>

      <button
        id="finalSubmitBtn"
        class="submit-btn"
        onclick="submitAllRequests()"
        ${submitDisabled ? "disabled" : ""}
      >
        ${cart.length
          ? `Submit ${cart.length} New Meeting Request${cart.length > 1 ? "s" : ""}`
          : "No New Requests"}
      </button>
    </div>
  `;
}

function editCartItem(companyId) {
  closeCart();
  openRequestModal(companyId);
}

function removeCartItem(companyId) {
  cart = cart.filter(item => item.companyId !== companyId);
  saveMeetingDraft();
  updateCartCount();
  renderCompanies();
  renderCart();
}

const submittedHtml = submittedRequests.length
  ? `
    <div style="margin-bottom:28px;">
      <h3 style="margin:0 0 14px;">
        Submitted Requests
      </h3>

      ${submittedRequests.map(item => `
        <div class="cart-item">
          <h4>${escapeHtml(item.companyName)}</h4>

          <div class="cart-meta">
            <div>
              <b>Products:</b>
              ${escapeHtml(item.productText || "")}
            </div>

            <div>
              <b>Reason:</b>
              ${escapeHtml(item.reason || "")}
            </div>

            <div>
              <b>Priority:</b>
              ${escapeHtml(item.priority || "")}
            </div>
          </div>

          <div
            style="
              margin-top:10px;
              font-size:12px;
              font-weight:800;
              color:#16a34a;
            "
          >
            ✓ Meeting Requested
          </div>
        </div>
      `).join("")}
    </div>
  `
  : "";

/* ============================================================
   7) GOOGLE FORM 직접 POST
   - 사용자는 Submit 버튼을 한 번만 누름
   - Google Form 응답 1건에 국내기업 1~30 문항을 순서대로 채움
   ============================================================ */

async function submitAllRequests() {
  const buyerCompany =
    String(currentBuyerCompany || "").trim();

  if (!buyerCompany) {
    alert("Buyer company information could not be found. Please contact KITA.");
    return;
  }

  if (!cart.length) {
    alert("신청할 기업이 없습니다.");
    return;
  }

  const isFirstSubmission =
    submittedRequests.length === 0;

  if (
    isFirstSubmission &&
    cart.length < 15
  ) {
    alert(
      "For your first submission, please select at least 15 companies."
    );
    return;
  }

  const totalRequestCount =
    submittedRequests.length + cart.length;

  if (totalRequestCount > 30) {
    alert(
      "Submitted requests and new meeting requests combined cannot exceed 30 companies."
    );
    return;
  }

  const btn = document.getElementById("finalSubmitBtn");
  btn.disabled = true;
  btn.textContent = "Submitting...";

  /*
    fetch() 대신 hidden form + iframe 방식을 사용.
    Google Forms는 cross-origin 응답을 JS에서 읽기 어렵기 때문에,
    사용자가 Google Form 화면으로 이동하지 않도록 백그라운드 iframe으로 제출함.
  */

  submitGoogleFormResponse({
    buyerCompany,
    items: cart
  });

  /*
    주의:
    cross-origin 특성상 브라우저에서 Google Form의 '실제 저장 성공' 응답을
    직접 판독하기는 어렵습니다.
    운영 전 반드시 테스트 응답을 시트에서 확인하세요.
  */

  setTimeout(() => {

  const justSubmitted = [...cart];

  submittedRequests = [
    ...submittedRequests,
    ...justSubmitted.filter(item =>
      !submittedRequests.some(
        submitted =>
          submitted.companyId === item.companyId
      )
    )
  ];

  markCurrentCartAsSubmitted(
    justSubmitted
  );

  cart = [];

  localStorage.removeItem(
    getLocalCartKey()
  );

  document.getElementById("cartBody").innerHTML = `
    <div class="success">
      <div class="icon">✓</div>
      <h2>Meeting requests submitted</h2>
      <p>
        ${justSubmitted.length}개 기업의 미팅 신청 완료.<br>
        감사합니다.
      </p>
    </div>
  `;

  updateCartCount();
  renderCompanies();

}, 1300);
}

function markCurrentCartAsSubmitted(items) {

  if (
    !currentBuyerCode ||
    !items.length
  ) {
    return;
  }

  const frameName =
    `draftSubmitFrame_${Date.now()}`;

  const iframe =
    document.createElement("iframe");

  iframe.name = frameName;
  iframe.style.display = "none";

  document
    .getElementById("hiddenFrames")
    .appendChild(iframe);


  const form =
    document.createElement("form");

  form.method = "POST";
  form.action = APPS_SCRIPT_URL;
  form.target = frameName;
  form.style.display = "none";


  addHiddenField(
    form,
    "action",
    "submit"
  );

  addHiddenField(
    form,
    "code",
    currentBuyerCode
  );

  addHiddenField(
    form,
    "cart",
    JSON.stringify(items)
  );


  document.body.appendChild(form);

  form.submit();
  form.remove();


  setTimeout(() => {
    iframe.remove();
  }, 10000);
}

function clearMeetingDraft() {

  if (!currentBuyerCode) return;

  // 브라우저 데이터 삭제
  localStorage.removeItem(
    getLocalCartKey()
  );


  // 서버 데이터 삭제
  const frameName =
    `draftClearFrame_${Date.now()}`;

  const iframe =
    document.createElement("iframe");

  iframe.name = frameName;
  iframe.style.display = "none";

  document
    .getElementById("hiddenFrames")
    .appendChild(iframe);


  const form =
    document.createElement("form");

  form.method = "POST";
  form.action = APPS_SCRIPT_URL;
  form.target = frameName;
  form.style.display = "none";


  addHiddenField(
    form,
    "action",
    "clear"
  );

  addHiddenField(
    form,
    "code",
    currentBuyerCode
  );


  document.body.appendChild(form);

  form.submit();
  form.remove();


  setTimeout(() => {
    iframe.remove();
  }, 10000);
}

function submitGoogleFormResponse({ buyerCompany, items }) {
  const frameName = `googleFormFrame_${Date.now()}`;

  const iframe = document.createElement("iframe");
  iframe.name = frameName;
  iframe.style.display = "none";
  document.getElementById("hiddenFrames").appendChild(iframe);

  const form = document.createElement("form");
  form.method = "POST";
  form.action = GOOGLE_FORM.formResponseUrl;
  form.target = frameName;
  form.style.display = "none";

  addHiddenField(form, "fvv", "1");
  addHiddenField(form, "draftResponse", "[]");
  addHiddenField(form, "pageHistory", "0");

  // 첫 번째 문항: 바이어사명
  addHiddenField(form, GOOGLE_FORM.buyerCompany, buyerCompany);

  // 국내기업 1 ~ 30 문항에 장바구니 순서대로 배치
  items.forEach((item, index) => {
    const fields = GOOGLE_FORM.requests[index];
    if (!fields) return;

    addHiddenField(form, fields.company, item.companyName);
    addHiddenField(form, fields.products, item.productText);
    addHiddenField(form, fields.reason, item.reason);
    addHiddenField(form, fields.priority, item.priority);
  });

  document.body.appendChild(form);

  console.log("Submitting Google Form:", {
    buyerCompany,
    requestCount: items.length,
    formAction: form.action
  });

  form.submit();

  setTimeout(() => {
    form.remove();
    iframe.remove();
  }, 5000);
}

function addHiddenField(form, name, value) {
  const input = document.createElement("input");
  input.type = "hidden";
  input.name = name;
  input.value = value;
  form.appendChild(input);
}

function saveCartToServer() {

  if (!currentBuyerCode) return;

  const frameName =
    `draftSaveFrame_${Date.now()}`;

  const iframe =
    document.createElement("iframe");

  iframe.name = frameName;
  iframe.style.display = "none";

  document
    .getElementById("hiddenFrames")
    .appendChild(iframe);


  const form =
    document.createElement("form");

  form.method = "POST";
  form.action = APPS_SCRIPT_URL;
  form.target = frameName;
  form.style.display = "none";


  addHiddenField(
    form,
    "action",
    "save"
  );

  addHiddenField(
    form,
    "code",
    currentBuyerCode
  );

  addHiddenField(
    form,
    "cart",
    JSON.stringify(cart)
  );


  document.body.appendChild(form);

  form.submit();
  form.remove();


  setTimeout(() => {
    iframe.remove();
  }, 10000);
}

function saveMeetingDraft() {
  saveCartToLocalStorage();
  saveCartToServer();
}

/* ============================================================
   8) HTML escape
   ============================================================ */

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttr(value) {
  return escapeHtml(value);
}

function scrollDetailToTop() {
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}
